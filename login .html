<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | ENEC Knowledge Management System</title>
    <link rel="icon" href="assets/favicon.jpg" />
    <link rel="stylesheet" href="css/main.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body.login-page {
        min-height: 100vh;
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          "Times New Roman",
          Times,
          serif;
        background: linear-gradient(
          135deg,
          #072a40 0%,
          #0b3d5c 55%,
          #1a5f8a 100%
        );
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .login-wrapper {
        width: 100%;
        max-width: 380px; /* smaller card */
      }

      .login-card {
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
        padding: 28px 26px 24px;
      }

      /* Simple header – no blue frame */
      .login-header {
        text-align: center;
        margin-bottom: 22px;
      }

      .login-header img {
        height: 120px !important;
        width: auto !important;
        max-width: 180px !important;
        max-height: none !important;
        margin-bottom: 14px !important;
        object-fit: contain !important;
      }

      .login-header h1 {
        font-size: 1.25rem;
        font-weight: 700;
        color: #072a40;
        margin-bottom: 4px;
      }

      .login-header p {
        font-size: 0.85rem;
        color: #666;
      }

      .alert-error {
        background: #fdecea !important;
        color: #c62828 !important;
        border: 1px solid #f5c6cb !important;
        padding: 10px 12px !important;
        border-radius: 8px !important;
        font-size: 0.85rem !important;
        margin-bottom: 16px !important;
        display: none !important; /* forced hidden */
      }

      .form-group {
        margin-bottom: 16px;
      }

      .form-group label {
        display: block;
        font-size: 0.88rem;
        font-weight: 600;
        color: #333;
        margin-bottom: 6px;
      }

      /* Icon outside the input */
      .input-with-outside-icon {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .outside-icon {
        font-size: 1.2rem;
        width: 26px;
        text-align: center;
        flex-shrink: 0;
      }

      .input-with-outside-icon input {
        flex: 1;
        width: 100%;
        padding: 11px 14px;
        border: 1.5px solid #dde3ea;
        border-radius: 8px;
        font-size: 0.92rem;
        background: #fafbfc;
        transition: all 0.2s;
      }

      .input-with-outside-icon input:focus {
        outline: none;
        border-color: #0b3d5c;
        background: #ffffff;
        box-shadow: 0 0 0 3px rgba(11, 61, 92, 0.12);
      }

      .login-options {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        font-size: 0.85rem;
      }

      .login-options label {
        display: flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        color: #555;
      }

      .forgot-link {
        color: #0b3d5c;
        font-weight: 600;
        text-decoration: none;
      }

      .forgot-link:hover {
        text-decoration: underline;
      }

      .btn-login-submit {
        width: 100%;
        padding: 12px;
        background: #0b3d5c;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
      }

      .btn-login-submit:hover {
        background: #072a40;
      }

      .login-footer {
        text-align: center;
        margin-top: 18px;
        padding-top: 14px;
        border-top: 1px solid #eee;
        font-size: 0.84rem;
        color: #666;
      }

      .login-footer a {
        color: #0b3d5c;
        font-weight: 600;
        text-decoration: none;
      }

      .back-home {
        display: inline-block;
        margin-top: 10px;
        color: #777;
        font-size: 0.84rem;
      }
    </style>
  </head>

  <body class="login-page">
    <div class="login-wrapper">
      <div class="login-card">
        <!-- Simple Header (no blue frame) -->
        <div class="login-header">
          <img src="assets/enec-logo.webp" alt="ENEC Logo" />
          <h1>Knowledge Management System</h1>
          <p>Ethiopian Nuclear Energy Commission</p>
        </div>

        <!-- Error (hidden by default) -->
        <div class="alert-error" id="error-msg">
          Invalid email or password. Please try again.
        </div>

        <form id="login-form">
          <!-- Email -->
          <div class="form-group">
            <label for="email">Email Address</label>
            <div class="input-with-outside-icon">
              <span class="outside-icon">👤</span>
              <input
                type="email"
                id="email"
                required
                placeholder="your.name@enec.gov.et"
                autocomplete="email"
              />
            </div>
          </div>

          <!-- Password -->
          <div class="form-group">
            <label for="password">Password</label>
            <div class="input-with-outside-icon">
              <span class="outside-icon">🔑</span>
              <input
                type="password"
                id="password"
                required
                placeholder="Enter your password"
                autocomplete="current-password"
              />
            </div>
          </div>

          <div class="login-options">
            <label>
              <input type="checkbox" name="remember" /> Remember me
            </label>
            <a href="forgot password.html" class="forgot-link"
              >Forgot password?</a
            >
          </div>

          <button type="submit" class="btn-login-submit">Sign In</button>
        </form>

        <div class="login-footer">
          <p>
            Need access? Contact
            <a href="mailto:km@enec.gov.et">km@enec.gov.et</a>
          </p>
          <a href="home.html" class="back-home">← Back to Home</a>
        </div>
      </div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        if (localStorage.getItem("enec_user")) {
          window.location.href = "home.html";
          return;
        }

        const form = document.getElementById("login-form");
        const errorMsg = document.getElementById("error-msg");

        form.addEventListener("submit", async function (e) {
          e.preventDefault();

          const email = document
            .getElementById("email")
            .value.trim()
            .toLowerCase();
          const password = document.getElementById("password").value;

          if (errorMsg) errorMsg.style.display = "none";

          try {
            const res = await fetch("http://localhost:3000/api/auth/login", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ email, password }),
            });

            const data = await res.json();

            if (res.ok && data.success) {
              localStorage.setItem("enec_user", JSON.stringify(data.user));
              alert("Login successful! Welcome " + data.user.name);
              window.location.href = "home.html";
            } else {
              if (errorMsg) {
                errorMsg.textContent =
                  data.message || "Invalid email or password";
                errorMsg.style.display = "block";
              } else {
                alert(data.message || "Invalid email or password");
              }
            }
          } catch (err) {
            console.error(err);
            alert("Cannot connect to API. Is the server running on port 3000?");
          }
        });
      });
    </script>
    <script src="js/main.js"></script>
    <script src="js/i18n.js"></script>
  </body>
</html>
