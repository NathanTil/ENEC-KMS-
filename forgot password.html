<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password | ENEC Knowledge Management System</title>
    <link rel="icon" href="assets/favicon.jpg" />
    <link rel="stylesheet" href="css/main.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body.login-page {
        min-height: 100vh;
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        background: linear-gradient(
          135deg,
          #072a40 0%,
          #0b3d5c 55%,
          #1a5f8a 100%
        );
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .login-wrapper {
        width: 100%;
        max-width: 380px;
      }

      .login-card {
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
        padding: 28px 26px 24px;
      }

      .login-header {
        text-align: center;
        margin-bottom: 22px;
      }

      .login-header img {
        height: 120px !important;
        width: auto !important;
        max-width: 180px !important;
        max-height: none !important;
        margin-bottom: 14px !important;
        object-fit: contain !important;
      }

      .login-header h1 {
        font-size: 1.25rem;
        font-weight: 700;
        color: #072a40;
        margin-bottom: 6px;
      }

      .login-header p {
        font-size: 0.88rem;
        color: #666;
        line-height: 1.45;
      }

      .alert-success {
        background: #e8f5e9 !important;
        color: #2e7d32 !important;
        border: 1px solid #c8e6c9 !important;
        padding: 10px 12px !important;
        border-radius: 8px !important;
        font-size: 0.85rem !important;
        margin-bottom: 16px !important;
        display: none !important;
      }

      .alert-error {
        background: #fdecea !important;
        color: #c62828 !important;
        border: 1px solid #f5c6cb !important;
        padding: 10px 12px !important;
        border-radius: 8px !important;
        font-size: 0.85rem !important;
        margin-bottom: 16px !important;
        display: none !important;
      }

      .form-group {
        margin-bottom: 16px;
      }

      .form-group label {
        display: block;
        font-size: 0.88rem;
        font-weight: 600;
        color: #333;
        margin-bottom: 6px;
      }

      .input-with-outside-icon {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .outside-icon {
        font-size: 1.2rem;
        width: 26px;
        text-align: center;
        flex-shrink: 0;
      }

      .input-with-outside-icon input {
        flex: 1;
        width: 100%;
        padding: 11px 14px;
        border: 1.5px solid #dde3ea;
        border-radius: 8px;
        font-size: 0.92rem;
        background: #fafbfc;
        transition: all 0.2s;
      }

      .input-with-outside-icon input:focus {
        outline: none;
        border-color: #0b3d5c;
        background: #ffffff;
        box-shadow: 0 0 0 3px rgba(11, 61, 92, 0.12);
      }

      .btn-login-submit {
        width: 100%;
        padding: 12px;
        background: #0b3d5c;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        margin-top: 6px;
      }

      .btn-login-submit:hover {
        background: #072a40;
      }

      .login-footer {
        text-align: center;
        margin-top: 18px;
        padding-top: 14px;
        border-top: 1px solid #eee;
        font-size: 0.84rem;
        color: #666;
      }

      .login-footer a {
        color: #0b3d5c;
        font-weight: 600;
        text-decoration: none;
      }

      .back-home {
        display: inline-block;
        margin-top: 10px;
        color: #777;
        font-size: 0.84rem;
      }
    </style>
  </head>

  <body class="login-page">
    <div class="login-wrapper">
      <div class="login-card">
        <!-- Header -->
        <div class="login-header">
          <img src="assets/enec-logo.webp" alt="ENEC Logo" />
          <h1>Forgot Password</h1>
          <p>
            Enter your email address and we will send you a link to reset your
            password.
          </p>
        </div>

        <!-- Messages -->
        <div class="alert-success" id="success-msg">
          If this email exists in our system, a reset link has been sent.
        </div>
        <div class="alert-error" id="error-msg">
          Please enter a valid email address.
        </div>

        <!-- Form -->
        <form id="forgot-form">
          <div class="form-group">
            <label for="email">Email Address</label>
            <div class="input-with-outside-icon">
              <span class="outside-icon">👤</span>
              <input
                type="email"
                id="email"
                required
                placeholder="your.name@enec.gov.et"
                autocomplete="email"
              />
            </div>
          </div>

          <button type="submit" class="btn-login-submit">
            Send Reset Link
          </button>
        </form>

        <!-- Footer -->
        <div class="login-footer">
          <a href="login .html">← Back to Login</a><br />
          <a href="home.html" class="back-home">Back to Home</a>
        </div>
      </div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const successMsg = document.getElementById("success-msg");
        const errorMsg = document.getElementById("error-msg");

        // Hide both messages on page load
        if (successMsg) successMsg.style.display = "none";
        if (errorMsg) errorMsg.style.display = "none";

        document
          .getElementById("forgot-form")
          .addEventListener("submit", function (e) {
            e.preventDefault();

            const email = document.getElementById("email").value.trim();

            successMsg.style.display = "none";
            errorMsg.style.display = "none";

            if (!email || !email.includes("@")) {
              errorMsg.style.display = "block";
              return;
            }

            // Show success message
            successMsg.style.display = "block";
            document.getElementById("email").value = "";
          });
      });
    </script>
    <script src="js/main.js"></script>
    <script src="js/i18n.js"></script>
  </body>
</html>
